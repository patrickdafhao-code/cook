<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DApp Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        :root { --primary: #007aff; --bg: #000; --card: #1c1c1e; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* 外部浏览器容器 */
        #ui-external { text-align: center; display: none; }
        .btn-main { padding: 18px 40px; background: var(--primary); border: none; border-radius: 16px; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }

        /* 钱包内部容器 */
        #ui-internal { display: none; text-align: center; }
        .status-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #333; width: 280px; }

        /* 弹窗样式 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .overlay.active { display: flex; }
        .modal { background: var(--card); width: 88%; max-width: 360px; border-radius: 28px; padding: 20px; border: 1px solid #333; max-height: 80vh; overflow-y: auto; }
        
        .modal-title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 20px; }

        /* 钱包选项网格/列表 */
        .wallet-list { display: flex; flex-direction: column; gap: 10px; }
        .wallet-option { display: flex; align-items: center; padding: 12px 16px; background: #2c2c2e; border-radius: 16px; cursor: pointer; transition: transform 0.1s; }
        .wallet-option:active { transform: scale(0.97); background: #3a3a3c; }
        
        .wallet-logo { width: 40px; height: 40px; border-radius: 10px; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; flex-shrink: 0; }
        .wallet-name { font-size: 16px; font-weight: 600; }

        .cancel-btn { text-align: center; margin-top: 15px; color: #ff453a; font-size: 15px; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div id="ui-external">
        <button class="btn-main" onclick="startConnect()">Connect Wallet</button>
    </div>

    <div id="ui-internal">
        <div class="status-card">
            <div style="color:#34c759; font-size: 40px; margin-bottom:10px;">✔</div>
            <div style="font-size: 18px; font-weight: bold;">Wallet Connected</div>
            <div id="addr" style="font-family: monospace; font-size: 12px; color: #888; margin-top: 10px; word-break: break-all;"></div>
        </div>
    </div>

    <div class="overlay" id="walletModal">
        <div class="modal">
            <div class="modal-title">Select Wallet</div>
            <div class="wallet-list">
                <div class="wallet-option" onclick="jumpTo('okx')">
                    <div class="wallet-logo" style="background:#fff">OKX</div>
                    <div class="wallet-name">OKX Wallet</div>
                </div>
                <div class="wallet-option" onclick="jumpTo('tp')">
                    <div class="wallet-logo" style="background:#2161ff; color:#fff">TP</div>
                    <div class="wallet-name">TokenPocket</div>
                </div>
                <div class="wallet-option" onclick="jumpTo('mm')">
                    <div class="wallet-logo" style="background:#f6851b; color:#fff">MM</div>
                    <div class="wallet-name">MetaMask</div>
                </div>
                <div class="wallet-option" onclick="jumpTo('im')">
                    <div class="wallet-logo" style="background:#098de6; color:#fff">IM</div>
                    <div class="wallet-name">imToken</div>
                </div>
                <div class="wallet-option" onclick="jumpTo('trust')">
                    <div class="wallet-logo" style="background:#3375bb; color:#fff">TW</div>
                    <div class="wallet-name">Trust Wallet</div>
                </div>
                <div class="wallet-option" onclick="jumpTo('bitget')">
                    <div class="wallet-logo" style="background:#00f0ff; color:#000">BG</div>
                    <div class="wallet-name">Bitget Wallet</div>
                </div>
            </div>
            <div class="cancel-btn" onclick="closeModal()">Cancel</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const currentUrl = window.location.href.split('?')[0];

        async function checkEnv() {
            // 给钱包注入留一点时间
            await new Promise(r => setTimeout(r, 600));
            const isWallet = (window.tronWeb && window.tronWeb.defaultAddress.base58) || window.ethereum;

            if (isWallet) {
                document.getElementById('ui-internal').style.display = 'block';
                if(window.tronWeb) document.getElementById('addr').innerText = window.tronWeb.defaultAddress.base58;
            } else {
                document.getElementById('ui-external').style.display = 'block';
                if (window.location.search.includes('os=safari')) openModal();
            }
        }

        function startConnect() {
            if (tg.platform !== "unknown" && !window.location.search.includes('os=safari')) {
                tg.openLink(currentUrl + '?os=safari', { try_browser: true });
            } else {
                openModal();
            }
        }

        function openModal() { document.getElementById('walletModal').classList.add('active'); }
        function closeModal() { document.getElementById('walletModal').classList.remove('active'); }

        function jumpTo(type) {
            let scheme = "";
            const encodedUrl = encodeURIComponent(currentUrl);

            switch(type) {
                case 'okx': 
                    scheme = "okx://wallet/dapp/details?dappUrl=" + encodedUrl; break;
                case 'tp': 
                    scheme = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": currentUrl})); break;
                case 'mm': 
                    scheme = "https://metamask.app.link/dapp/" + currentUrl.replace("https://", ""); break;
                case 'im': 
                    scheme = "imtokenv2://navigate?screen=DappView&url=" + encodedUrl; break;
                case 'trust': 
                    scheme = "trust://dl?url=" + encodedUrl; break;
                case 'bitget': 
                    scheme = "bitkeep://bkconnect?url=" + encodedUrl; break;
            }

            if (scheme) window.location.href = scheme;
        }

        window.onload = checkEnv;
    </script>
</body>
</html>
