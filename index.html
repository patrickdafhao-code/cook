<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .btn {
            display: block; width: 220px; padding: 18px; 
            background: #2161ff; color: white; text-align: center;
            text-decoration: none; font-weight: bold; border-radius: 12px;
            font-size: 16px; border: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 97, 255, 0.4);
        }
        #status { margin-top: 20px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div id="status">> 正在检测环境...</div>
    
    <button id="mainBtn" class="btn">Connect Wallet</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');
        const myUrl = "https://patrickdafhao-code.github.io/cook/"; // 你的 GitHub 地址

        async function handleConnect() {
            // 1. 如果已经在钱包 App 内部
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                const addr = window.tronWeb.defaultAddress.base58;
                status.innerText = "已连接: " + addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
                btn.style.background = "#4caf50";
                btn.innerText = "Connected";
                return;
            }

            // 2. 如果在 Telegram 内部 (iOS)
            if (tg.platform === "ios" || tg.platform === "android") {
                tg.HapticFeedback.impactOccurred('medium');
                // 强制跳出 Telegram 并在系统浏览器打开
                tg.openLink(myUrl, { try_browser: true });
                status.innerText = "正在打开外部浏览器...";
                return;
            }

            // 3. 如果在浏览器 (Safari) 内部
            const tpProtocol = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": myUrl}));
            window.location.href = tpProtocol;
            status.innerText = "正在唤起 TokenPocket...";
        }

        btn.onclick = handleConnect;

        // 页面进入时的检测
        window.onload = () => {
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                status.innerText = "钱包环境就绪";
                btn.innerText = "Connect Wallet";
            } else {
                status.innerText = "请点击按钮连接钱包";
            }
        };
    </script>
</body>
</html>
